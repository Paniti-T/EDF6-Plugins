[CorpseCleanup]
; Seconds an enemy corpse may stay before it is removed.
; Game default is 15-30 depending on enemy type. 0 = leave the game's timing alone.
CorpseSeconds=0

; Ragdoll budget: when the total cost of live corpses reaches this, the oldest
; corpse is removed. Game default is 512 (256 on some settings). 0 = game default.
RagdollBudget=0

; 1 = also track corpses of enemies spawned by teleport anchors / generators
; (the game only does this in a couple of missions). Same effect as
; EDF6GeneratorBodyBudget; the two are compatible.
AcceptGeneratorCorpses=1

; 1 = corpses have no hitbox: bullets, explosions and line-of-sight checks pass
; through them. Corpses still fall and rest on the ground normally.
DisableCorpseHitbox=1

; 0 = off, 1 = startup info, 2 = stats every 10 s, 3 = every removal
Log=0
